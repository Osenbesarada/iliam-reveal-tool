<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>立ち絵公開ビューア</title>
  <style>
    body {
      background: #fafafa;
      text-align: center;
      font-family: sans-serif;
    }
    #container {
      width: 400px;
      overflow: hidden;
      margin: 20px auto;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: white;
    }
    #image {
      width: 100%;
      display: block;
    }
  </style>
</head>
<body>

<h2>立ち絵公開ビューア</h2>

<div id="container">
  <img id="image" src="" alt="立ち絵">
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  // 🔧 Firebase 設定（修正版）
  const firebaseConfig = {
    apiKey: "AIzaSyCBqLHyDTuOgqDSNE1myi6JfAKR925gx1Y",
    authDomain: "iliam-reveal-tool.firebaseapp.com",
    databaseURL: "https://iliam-reveal-tool-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "iliam-reveal-tool",
    storageBucket: "iliam-reveal-tool.appspot.com",
    messagingSenderId: "238880304896",
    appId: "1:238880304896:web:e0973954e377aac0714de5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const container = document.getElementById("container");
  const image = document.getElementById("image");

  // 🔥 Realtime Database の state を監視
  onValue(ref(db, "state"), (snapshot) => {
    const data = snapshot.val();

    // Base64 画像をそのまま表示
    image.src = data.image;

    // 解放ピクセル数に応じて高さを変更
    container.style.height = `${data.revealed}px`;
  });
</script>

</body>
</html>
